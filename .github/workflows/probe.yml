name: Probe (einmalig)
on:
  push:
    branches: [main]
    paths: ['tools/probe.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py 2>&1 | tee debug.log
      - run: |
          mkdir -p debug && mv debug.log debug/
          git config user.name "deal-agent"; git config user.email "deal-agent@users.noreply.github.com"
          git add debug && git commit -m "Probe-Ergebnis [skip ci]" && git pull --rebase --autostash && git push
